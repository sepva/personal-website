    <link rel="canonical" href="https://seppevanswegenoven.be/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Seppe Vanswegenoven" />
    <meta
      property="og:description"
      content="Personal website of Seppe Vanswegenoven. Get to know more about my work, fun (AI) projects, and academic achievements."

    <meta property="og:url" content="https://seppevanswegenoven.be/" />
    <meta
      property="og:image"

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Personal website of Seppe Vanswegenoven. Get to know more about my work, fun (AI) projects, and academic achievements."

    <title>Seppe Vanswegenoven</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Seppe Vanswegenoven",
        "url": "https://seppevanswegenoven.be/",
        "image": "https://seppevanswegenoven.be/CV_picture.jpeg"
      }
    </script>

    <script>
      document.documentElement.classList.toggle(
        "dark",
        localStorage.theme === "dark" ||
          (!("theme" in localStorage) &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
      );
    </script>

    <!-- Favicon support -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preload fonts if any -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Prevent flash of unstyled content -->
    <style>
      html {
        background: var(--background);
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: var(--background);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
